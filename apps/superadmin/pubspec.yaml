name: coelo_superadmin
description: Aplicacao Flutter privada para operacao interna Coelo.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  characters: 1.4.1
  crypto: 3.0.6
  coelo_api:
    path: ../../packages/coelo_api
  coelo_auth:
    path: ../../packages/coelo_auth
  coelo_domain:
    path: ../../packages/coelo_domain
  coelo_tokens:
    path: ../../packages/coelo_tokens
  coelo_ui_admin:
    path: ../../packages/coelo_ui_admin
  coelo_ui_core:
    path: ../../packages/coelo_ui_core
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.10
  flutter_map: 8.3.2
  flutter_svg: 2.2.3
  flutter_web_plugins:
    sdk: flutter
  go_router: ^16.0.0
  http: 1.6.0
  latlong2: 0.10.1
  shared_preferences: ^2.5.4
  supabase_flutter: 2.16.0
  url_launcher: 6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo-coelo-white.svg
    - assets/brand/logo-coelo-orange.svg
    - assets/brand/logo-coelo-orange.png
    - assets/brand/logo-coelo-orange-complete.png
    - assets/principal_profile/institution-cover.png
    - assets/principal_profile/institution-crest.png
    - assets/principal_profile/highlights-strip.png
    - assets/principal_happens/now-strip.png
    - assets/principal_happens/feed-strip.png
    - assets/principal_moments/moments-strip.png
    - assets/principal_now/story-strip.png
    - assets/agenda/event-thumbnails.png
  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/brand/NunitoSans-VariableFont.ttf
